<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Exchange</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="phone" id="app">
    <div id="status" class="status" hidden></div>
    <div id="incoming"></div>
    <div id="outgoing"></div>
    <div id="main" class="main"></div>
    <div id="actions" class="row" hidden>
      <button class="btn" id="tradeBtn">Trade</button>
    </div>
  </div>

  <!-- Trade sheet: full-screen overlay with partner list, then preview + offer. -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-head">
      <button class="link" id="sheetBack" hidden>‹ Back</button>
      <div class="sheet-title" id="sheetTitle">Trade</div>
      <button class="link" id="sheetClose">Close</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/sim.js"></script>
  <script src="/card.js"></script>
  <script src="/offices.js"></script>
  <script src="/student.js"></script>
</body>
</html>
