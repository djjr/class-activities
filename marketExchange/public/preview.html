<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chair card preview</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Design preview of the chair card with random data. No server needed:
       open it on a phone, hold it up, and check it reads from across a room. -->
  <div class="phone">
    <div id="card"></div>
    <div class="row">
      <button class="btn secondary" id="next">Trade for another chair</button>
      <button class="btn" disabled>Trade</button>
    </div>
  </div>
  <script src="../sim.js"></script>
  <script src="card.js"></script>
  <script>
    const NAMES = ['Maya', 'Jordan', 'Priya', 'Sam', 'Diego', 'Lin', 'Ava', 'Kofi', 'Noor', 'Eli'];
    const rand = MarketSim.makeRng(Number(new URLSearchParams(location.search).get('seed')) || Date.now());
    // One student: name and target are fixed for the phase, as in the real
    // app. "Trade for another chair" changes only what they hold, which is
    // all a completed trade changes.
    const me = MarketSim.newEconomy('chairs', 2, rand);
    const nickname = NAMES[Math.floor(rand() * NAMES.length)];
    function draw() {
      const chair = MarketSim.newEconomy('chairs', 2, rand).chairs[0];
      const e = { ...me, chairs: [chair] };
      renderChairCard(document.getElementById('card'), {
        dims: MarketSim.DIMS, chair, target: me.targets[0],
        score: MarketSim.chairScore(e, 0, 0), nickname,
      });
    }
    document.getElementById('next').onclick = draw;
    draw();
  </script>
</body>
</html>
